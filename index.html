<style>
:root{--kinari:#F5EFE2;--sumi:#1E1B18;--shu:#D2492F;--ai:#22385F;--ki:#A87B4F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#17120e;overflow:hidden;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--sumi);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#2a211b}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hudbtn{position:absolute;top:1.6%;height:5.2%;aspect-ratio:1;border:0;border-radius:9px;background:#3b2f27;color:var(--kinari);
  font:700 12px/1 inherit;font-family:inherit;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#bSound{right:1.8%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%}
.ov.on{display:flex}

#title h1{font-weight:900;color:var(--kinari);font-size:min(9.4vw,5.6vh,38px);line-height:1.15;margin:0;letter-spacing:.02em;white-space:nowrap}
#title h1 span{color:#FFC97A}
#title p.lead{color:var(--kinari);font-weight:700;font-size:min(3.5vw,2.1vh,14px);margin:.35em 0 0;line-height:1.5;white-space:nowrap}
.top{flex:none}
#pvWrap{position:relative;flex:none;width:100%;overflow:hidden;border-top:3px solid #5a4838;border-bottom:3px solid #5a4838;background:#d6cb93}
#pvWrap canvas{display:block;width:100%;height:auto}
#pvWrap span{position:absolute;left:8px;top:8px;background:rgba(30,27,24,.78);color:#FFC97A;font-size:11px;font-weight:900;border-radius:999px;padding:2px 9px;letter-spacing:.1em}
.how{list-style:none;margin:0;padding:0;color:var(--kinari);font-size:min(3.5vw,2.1vh,14px);font-weight:500;line-height:1.45;text-align:left}
.how li{margin:.4em 0;padding-left:1.9em;position:relative}
.how li b{position:absolute;left:0;top:.05em;width:1.4em;height:1.4em;border-radius:50%;background:#FFC97A;color:var(--sumi);
  font-size:.85em;display:flex;align-items:center;justify-content:center}
.btn{font-family:inherit;font-weight:900;border:0;border-radius:999px;cursor:pointer;font-size:min(5vw,20px);padding:.7em 2.2em;
  background:var(--shu);color:#fff;box-shadow:0 4px 0 #8f2f1c;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2f1c}
.btn.sub{background:var(--kinari);color:var(--sumi);box-shadow:0 4px 0 #b9ad93}
#result{background:rgba(30,22,16,.8)}

.card .cap{font-size:12px;font-weight:700;color:#8a7a63;letter-spacing:.2em}

.rows div span:last-child{font-variant-numeric:tabular-nums;text-align:right}

<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <button class="hudbtn" id="bSound" aria-label="音">音</button>

  <div class="ov on" id="title">
    <div class="top"><h1>こたつから<span>出ない</span></h1>
    <p class="lead">60秒。こたつに入ったまま、ほしいものを手元へ。</p></div>
    <div id="pvWrap"><canvas id="pv"></canvas></div>
    <ul class="how">
      <li><b>1</b>さわったところへ、手がのびる</li>
      <li><b>2</b>届かないものは、うちわや孫の手を のばして、引く</li>
      <li><b>3</b>むりに伸ばすと、こたつから出て冷える</li>
    </ul>
    <button class="btn" id="bStart">はじめる</button>
  </div>

  <div class="ov" id="result">
    <div class="card">
      <div class="cap">きょうの こたつ</div>
      <div class="rank" id="rRank"></div>
      <div class="pts"><span id="rPts">0</span><small>点</small></div>
      <div class="chips" id="rChips"></div>
      <div class="rows">
        <div><span>手元に来たもの</span><span id="rGot"></span></div>
        <div><span>こたつから出ていた時間</span><span id="rOut"></span></div>
        <div><span>いちばん出た長さ</span><span id="rMax"></span></div>
        <div id="rBonusRow"><span id="rBonusL"></span><span id="rBonus"></span></div>
      </div>
      <div class="acts"><button class="btn" id="bAgain">もう一回</button></div>
      <div class="acts two">
        <button class="btn sub" id="bShare">画像を共有</button>
        <a class="btn sub" id="bPost" target="_blank" rel="noopener">Xにポスト</a>
      </div>
    </div>
  </div>

  <div class="ov" id="shot">
    <img id="shotImg" alt="結果の画像">
    <p>画像を長押しして保存できます</p>
    <button class="btn sub" id="bShotClose">とじる</button>
  </div>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),stage=$('stage');let ctx=cv.getContext('2d');
const W=400;let H=700,dpr=1;
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const hyp=Math.hypot;
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

/* ---------- 調整値 ---------- */
const DEF={time:60,arm:150,mago:125,cold:1,roll:1,cat:true,sound:true};
const P={...DEF}; // 公開版は固定。音の ON/OFF だけ、この端末に覚える
try{if(localStorage.getItem('kotatsu_sound')==='0')P.sound=false}catch(e){}
const saveP=()=>{try{localStorage.setItem('kotatsu_sound',P.sound?'1':'0')}catch(e){}};
const OUTMAX=80;      // こたつから出られる長さ
const CM=0.7;         // 1目盛り＝約0.7cm

/* ---------- 部屋の寸法 ---------- */
let R,TV,K,B,S0,Z,ZR=58,REST,CU=[],FU=[],roomI=0;
// 部屋は3種類。遊ぶたびに入れかわる（壁ぎわの家具・床・布団の色がちがう）
const ROOMS=[
  {n:'和室',floor:'tatami',bl:['#b8473a','#a53d32'],tvx:128,fu:()=>[]},
  {n:'青い布団の部屋',floor:'tatami',bl:['#2f5d8a','#284f76'],tvx:22,fu:R=>[{x:R.x1-66,y:60,w:66,h:78,t:'tansu'}]},
  {n:'板の間',floor:'wood',bl:['#4d7a52','#426b47'],tvx:234,fu:R=>[{x:R.x0,y:60,w:60,h:60,t:'plant'}]}
];
function pickRoom(){let r;do{r=Math.random()*ROOMS.length|0}while(r===roomI);roomI=r}
function geom(){
  R={x0:10,y0:60,x1:W-10,y1:H-10};
  TV={x:ROOMS[roomI].tvx,y:60,w:144,h:30};FU=ROOMS[roomI].fu(R);
  K={x:200,y:H-118};
  B={x:K.x-118,y:K.y-100,w:236,h:H-10-(K.y-100)};
  S0={x:K.x+26,y:B.y-8};
  Z={x:S0.x-8,y:B.y-12};
  REST={x:S0.x+20,y:S0.y-58};
  CU=[{x:R.x0,y:B.y+48,w:B.x-R.x0+6,h:R.y1-B.y-48,c:'#5b4a6e'},{x:B.x+B.w-6,y:B.y+48,w:R.x1-B.x-B.w+6,h:R.y1-B.y-48,c:'#4f6644'}];
}

/* ---------- もの ---------- */
const KIND={
  mikan:{n:'みかん',r:11,fr:150,drag:.5,wish:'みかん たべたい'},
  remote:{n:'リモコン',r:14,fr:620,drag:2,wish:'リモコン どこ'},
  tissue:{n:'ティッシュ',r:19,fr:820,drag:2.5,wish:'ティッシュ…'},
  phone:{n:'スマホ',r:14,fr:560,drag:2,wish:'スマホ 見たい'},
  tea:{n:'お茶',r:12,fr:640,drag:2,wish:'お茶 のみたい'},
  senbei:{n:'せんべい',r:12,fr:480,drag:1.6,wish:'せんべい たべたい'},
  manga:{n:'まんが',r:17,fr:760,drag:2.4,wish:'まんが 読みたい'},
  megane:{n:'めがね',r:12,fr:520,drag:1.8,wish:'めがね めがね…'},
  uchiwa:{n:'うちわ',r:12,fr:700,drag:2.4,tool:true,len:46},
  cup:{n:'湯のみ',r:12,fr:640,drag:2,wish:'湯のみ かたづけたい'},
  mago:{n:'孫の手',r:12,fr:700,drag:2.4,tool:true,len:125}
};
let objs=[],puddles=[],parts=[],floats=[];
let hand,S,out=0,toolAng=-Math.PI/2,held=null,cold=0,shiver=0,wasOut=false;
let ptr={down:false,x:0,y:0},intent=null;
let mode='demo',tLeft=60,score=0,got=[],wish=null,wishT=0,outCount=0,maxOut=0,spilled=0,combo=0,comboT=0,pets=0;
let wipe=false,wiped=false,outTime=0,sneezes=0,hint='',hintT=0,endT=0,allDone=false,clock=0;
let cat=null;
let prevCols=[];let sideS=1,demoEnd=0;const isLive=()=>mode==='play'||mode==='demo';
let bot={st:'idle',t:0,tg:null,ux:0,uy:0,px:0,py:0,skip:null,last:null};let liftT=0,lifted=false,prevHd=0,prevHand={x:0,y:0};const fing={down:false,x:0,y:0};

function mk(kind,x,y){const k=KIND[kind];return{kind,x,y,vx:0,vy:0,r:k.r,rot:rnd(0,TAU),tool:!!k.tool,alive:true,held:false,len:k.len||0,born:0}}
function toolLen(o){return o.kind==='mago'?P.mago:KIND.uchiwa.len}
// 手を体に引きつけるほど、柄が後ろへ抜けて先が手前に来る
function effLen(o){const L=toolLen(o),d=hyp(hand.x-S.x,hand.y-S.y);return L*clamp((d-14)/70,.1,1)}

function place(kind,d0,d1,list){
  for(let i=0;i<400;i++){
    const d=rnd(d0,d1),a=rnd(-Math.PI*.93,-Math.PI*.07);
    const x=S0.x+Math.cos(a)*d,y=S0.y+Math.sin(a)*d,r=KIND[kind].r;
    if(x<R.x0+r+6||x>R.x1-r-6||y<TV.y+TV.h+r+10||y>B.y+10)continue;
    if(list.some(o=>hyp(o.x-x,o.y-y)<o.r+r+(o.tool||KIND[kind].tool?34:16)))continue;
    if(zoneD(x,y)<ZW+r+14)continue;
    if(FU.some(q=>x>q.x-r-8&&x<q.x+q.w+r+8&&y>q.y-r-8&&y<q.y+q.h+r+8))continue;
    const o=mk(kind,x,y);list.push(o);return o;
  }
  const o=mk(kind,rnd(60,340),rnd(130,B.y-80));list.push(o);return o;
}
function newRoom(){
  pickRoom();geom();makeFloor();objs=[];puddles=[];parts=[];floats=[];
  const A=P.arm,far1=Math.min(A+P.mago+OUTMAX*.55,S0.y-TV.y-TV.h-30);
  place('uchiwa',A*.62,A*.8,objs);
  place('mago',A+38,A+62,objs);
  place('mikan',A*.5,A*.86,objs);
  place('senbei',A*.55,A*.9,objs);
  place('remote',A+25,A+85,objs);
  place('phone',A+25,A+85,objs);
  place('tea',A+30,A+90,objs);
  place('mikan',A+40,A+95,objs);
  place('tissue',A+105,far1,objs);
  place('manga',A+105,far1,objs);
  place('megane',A+110,far1,objs);
  place('mikan',A+110,far1,objs);
  hand={x:REST.x,y:REST.y};S={x:S0.x,y:S0.y};out=0;held=null;cold=0;shiver=0;wasOut=false;toolAng=-Math.PI/2;
  intent=null;prevCols=[];ptr.down=false;fing.down=false;bot={st:'idle',t:0,tg:null,ux:0,uy:0,px:0,py:0,skip:null,last:null};
  cat=null;
  if(P.cat){ // 掃除機は、お茶からいちばん遠いところで3秒止まってから動きだす
    const tea=objs.find(o=>o.kind==='tea');let bx=200,by=TV.y+TV.h+40,bd=-1;
    for(let i=0;i<40;i++){const x=rnd(40,360),y=rnd(TV.y+TV.h+30,B.y-150);
      if(FU.some(q=>x>q.x-24&&x<q.x+q.w+24&&y>q.y-24&&y<q.y+q.h+24)||objs.some(o=>hyp(o.x-x,o.y-y)<o.r+26))continue;
      const d=hyp(x-tea.x,y-tea.y);if(d>bd){bd=d;bx=x;by=y}}
    cat={x:bx,y:by,tx:0,ty:0,st:'sit',t:3,ang:Math.PI/2,walk:0,bump:0,r:17,kind:'robo',vx:0,vy:0};
  }
}
function startGame(){
  newRoom();mode='play';tLeft=P.time;score=0;got=[];wipe=false;wiped=false;outTime=0;sneezes=0;outCount=0;maxOut=0;spilled=0;combo=0;pets=0;allDone=false;endT=0;
  wish=null;pickWish();say('さわったところへ 手がのびる',4);
  $('title').classList.remove('on');$('result').classList.remove('on');
}
function startDemo(){
  newRoom();mode='demo';tLeft=45;score=0;got=[];wipe=false;wiped=false;outTime=0;sneezes=0;outCount=0;maxOut=0;spilled=0;combo=0;pets=0;allDone=false;demoEnd=0;wish=null;pickWish();
}
function remaining(){return objs.filter(o=>o.alive&&!o.tool)}
function pickWish(){
  const ks=[...new Set(remaining().map(o=>o.kind))];
  if(!ks.length){wish=null;return}
  const c=ks.filter(k=>k!==wish);wish=(c.length?c:ks)[Math.random()*(c.length||ks.length)|0];wishT=0;
}
function say(s,t=3){hint=s;hintT=t}
// 手元＝こたつのふち。ここまで来たら取れる
const ZW=42;function zoneD(x,y){return segDist(x,y,B.x+44,B.y-6,B.x+B.w-44,B.y-6)}

/* ---------- 音 ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function tone(f,d,type='sine',v=.12,f2=null,delay=0){
  if(!ac||!P.sound||mode==='demo')return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v=.12,fc=1200,delay=0){
  if(!ac||!P.sound||mode==='demo')return;const t=ac.currentTime+delay,n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;
  s.connect(f).connect(g).connect(ac.destination);s.start(t);
}
let lastTick=0;
const sfx={
  tick(sp){const n=performance.now();if(n-lastTick<45)return;lastTick=n;tone(rnd(180,240),.05,'triangle',clamp(sp/900,.02,.09))},
  grab(){tone(420,.07,'triangle',.1,560)},
  get(i){const b=[523,587,659,784,880,988,1047][Math.min(i,6)];tone(b,.12,'triangle',.13);tone(b*1.5,.18,'triangle',.11,null,.07)},
  wish(){[659,784,988,1319].forEach((f,i)=>tone(f,.16,'triangle',.12,null,i*.06))},
  spill(){noise(.35,.16,900);tone(300,.3,'sine',.08,90)},
  cat(){tone(988,.06,'square',.035);tone(1319,.08,'square',.035,null,.09)},
  purr(){for(let i=0;i<6;i++)tone(70,.05,'sawtooth',.05,null,i*.07)},
  sneeze(){noise(.12,.1,3000);noise(.3,.2,1800,.22);tone(500,.2,'square',.04,160,.22)},
  out(){tone(240,.14,'sine',.07,180)},
  end(){[523,392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.11,null,i*.13))},
  fan(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.12,null,i*.09))}
};

/* ---------- 入力 ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return hyp(px-ax-dx*t,py-ay-dy*t)}
function toolSeg(o){const l=toolLen(o)/2+(o.kind==='uchiwa'?10:0),c=Math.cos(o.rot),s=Math.sin(o.rot);return[o.x-c*l,o.y-s*l,o.x+c*l,o.y+s*l]}
function distTo(o,x,y){if(o.tool){const s=toolSeg(o);return segDist(x,y,s[0],s[1],s[2],s[3])-8}return hyp(o.x-x,o.y-y)-o.r}
function under(x,y,tol=18){let best=null,bd=tol;for(const o of objs){if(!o.alive||o.held)continue;const d=distTo(o,x,y);if(d<bd){bd=d;best=o}}return best}
function press(){ // 指が置かれた（または、くしゃみが終わっても置かれたまま）
  ptr.down=true;ptr.x=fing.x;ptr.y=fing.y;
  if(held&&held.tool){
    if(zoneD(ptr.x,ptr.y)<ZW){drop();return}
    const u=under(ptr.x,ptr.y);
    if(u&&u!==held){const d=u.tool?segDist(S0.x,S0.y,...toolSeg(u)):hyp(u.x-S0.x,u.y-S0.y);if(d<=P.arm+6)drop()}
  }
}
cv.addEventListener('pointerdown',e=>{

/* ---------- 物理 ---------- */
function buildCols(){

      c.push({ax:tx,ay:ty,bx:tx+px*15-ux*9,by:ty+py*15-uy*9,rad:4,tool:1,head:1});
      c.push({ax:tx,ay:ty,bx:tx-px*15-ux*9,by:ty-py*15-uy*9,rad:4,tool:1,head:1});
    }else{
      c.push({ax:hand.x+ux*14,ay:hand.y+uy*14,bx:hand.x+ux*Math.max(14,L-19),by:hand.y+uy*Math.max(14,L-19),rad:3,tool:1});
      c.push({ax:tx,ay:ty,bx:tx,by:ty,rad:19,tool:1,head:1});
    }
  }
  { // 腕と体：掃除機は下をくぐれない（ものには当てない）
    const dx=hand.x-S.x,dy=hand.y-S.y,d=hyp(dx,dy)||1,a=Math.max(P.arm/2*1.03,d/2+.01),ux=dx/d,uy=dy/d,hh=Math.min(46,Math.sqrt(Math.max(0,a*a-d*d/4)));
    const ex=S.x+ux*d/2-uy*hh*sideS,ey=S.y+uy*d/2+ux*hh*sideS,cx=K.x+S.x-S0.x,cy=B.y-10+S.y-S0.y;
    c.push({ax:S.x,ay:S.y,bx:ex,by:ey,rad:9,arm:1},{ax:ex,ay:ey,bx:hand.x,by:hand.y,rad:9,arm:1},{ax:K.x,ay:B.y+34,bx:cx,by:cy+6,rad:30,arm:1},{ax:cx,ay:cy-16,bx:cx,by:cy-16,rad:19,arm:1});
  }
  if(cat)c.push({ax:cat.x,ay:cat.y,bx:cat.x,by:cat.y,rad:15,cat:true});

}
function colSeg(o,ax,ay,bx,by,rad,avx,avy,bvx,bvy){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l>1e-6?clamp(((o.x-ax)*dx+(o.y-ay)*dy)/l,0,1):0;
  let nx=o.x-(ax+dx*t),ny=o.y-(ay+dy*t),d=hyp(nx,ny);const min=o.r+rad;
  if(d>=min)return;
  if(d<1e-4){nx=0;ny=-1;d=1}nx/=d;ny/=d;o.x+=nx*(min-d);o.y+=ny*(min-d);
  const vr=(o.vx-(avx+(bvx-avx)*t))*nx+(o.vy-(avy+(bvy-avy)*t))*ny;
  if(vr<0){o.vx-=1.08*vr*nx;o.vy-=1.08*vr*ny;impact(o,-vr)}
}
function colRect(o,rx,ry,rw,rh,e){
  const cx=clamp(o.x,rx,rx+rw),cy=clamp(o.y,ry,ry+rh);let nx=o.x-cx,ny=o.y-cy,d=hyp(nx,ny);
  if(d>=o.r)return;
  if(d<1e-4){ // 中に入った：いちばん近い辺へ
    const l=o.x-rx,r=rx+rw-o.x,t=o.y-ry,b=ry+rh-o.y,m=Math.min(l,r,t,b);
    if(m===t){o.y=ry-o.r;if(o.vy>0)o.vy*=-e}else if(m===l){o.x=rx-o.r;if(o.vx>0)o.vx*=-e}else if(m===r){o.x=rx+rw+o.r;if(o.vx<0)o.vx*=-e}else{o.y=ry+rh+o.r;if(o.vy<0)o.vy*=-e}
    return;
  }
  nx/=d;ny/=d;o.x+=nx*(o.r-d);o.y+=ny*(o.r-d);const vn=o.vx*nx+o.vy*ny;
  if(vn<0){o.vx-=(1+e)*vn*nx;o.vy-=(1+e)*vn*ny;impact(o,-vn)}
}
function physics(dt){
  const cur=buildCols();
  if(prevCols.length!==cur.length)prevCols=cur.map(c=>({...c}));
  const N=6,h=dt/N,live=objs.filter(o=>o.alive&&!o.held);let roboHit=false;
  const cand=ptr.down&&!held?under(ptr.x,ptr.y):null;
  for(let k=1;k<=N;k++){
    const f=k/N;
    for(const o of live){
      if(!o.alive)continue;
      const kd=KIND[o.kind];let sp=hyp(o.vx,o.vy);
      if(sp>0){
        const fr=(o.kind==='mikan'?kd.fr/P.roll:kd.fr),ns=Math.max(0,sp-fr*h)*Math.max(0,1-kd.drag*h);
        o.vx*=ns/sp;o.vy*=ns/sp;sp=ns;
        o.x+=o.vx*h;o.y+=o.vy*h;if(o.kind==='mikan')o.rot+=sp*h/o.r*(o.vx>=0?1:-1);
      }
      for(let i=0;i<cur.length;i++){
        const c=cur[i],p=prevCols[i];if(c.arm)continue;if(c.hand&&(o===cand||shiver>0))continue;if(c.tool&&lifted)continue;
        if(c.cat&&o.kind==='tea'&&o.alive&&cat.job!==o&&hyp(o.x-cat.x,o.y-cat.y)<o.r+c.rad+.5){spill(o,true);break}
        const ax=lerp(p.ax,c.ax,f),ay=lerp(p.ay,c.ay,f),bx=lerp(p.bx,c.bx,f),by=lerp(p.by,c.by,f);
        colSeg(o,ax,ay,bx,by,c.rad,(c.ax-p.ax)/dt,(c.ay-p.ay)/dt,(c.bx-p.bx)/dt,(c.by-p.by)/dt);
      }
      // かべ
      if(o.x<R.x0+o.r){o.x=R.x0+o.r;if(o.vx<0){impact(o,-o.vx);o.vx*=-.45}}
      if(o.x>R.x1-o.r){o.x=R.x1-o.r;if(o.vx>0){impact(o,o.vx);o.vx*=-.45}}
      if(o.y<R.y0+o.r){o.y=R.y0+o.r;if(o.vy<0){impact(o,-o.vy);o.vy*=-.45}}
      if(o.y>R.y1-o.r){o.y=R.y1-o.r;if(o.vy>0)o.vy*=-.45}
      colRect(o,TV.x,TV.y,TV.w,TV.h,.4);for(const q of FU)colRect(o,q.x,q.y,q.w,q.h,.4);
      colRect(o,B.x+8,B.y+6,B.w-16,B.h,.2);for(const q of CU)colRect(o,q.x,q.y,q.w,q.h,.2);
    }
    if(cat){ // 掃除機も、手や道具に押される
      const o=cat,sp=hyp(o.vx,o.vy);if(sp>0){const ns=Math.max(0,sp-1400*h);o.vx*=ns/sp;o.vy*=ns/sp;o.x+=o.vx*h;o.y+=o.vy*h}
      const bx0=o.x,by0=o.y;
      for(let i=0;i<cur.length;i++){const c=cur[i],p=prevCols[i];if(c.cat||(c.hand&&shiver>0)||(c.tool&&lifted))continue;
        colSeg(o,lerp(p.ax,c.ax,f),lerp(p.ay,c.ay,f),lerp(p.bx,c.bx,f),lerp(p.by,c.by,f),c.rad,(c.ax-p.ax)/dt,(c.ay-p.ay)/dt,(c.bx-p.bx)/dt,(c.by-p.by)/dt)}
      if(o.x!==bx0||o.y!==by0)roboHit=true;
      const v=hyp(o.vx,o.vy);if(v>420){o.vx*=420/v;o.vy*=420/v}
      o.x=clamp(o.x,R.x0+o.r,R.x1-o.r);o.y=clamp(o.y,R.y0+o.r,R.y1-o.r);
      colRect(o,TV.x,TV.y,TV.w,TV.h,.2);for(const q of FU)colRect(o,q.x,q.y,q.w,q.h,.2);colRect(o,B.x+8,B.y+6,B.w-16,B.h,.2);for(const q of CU)colRect(o,q.x,q.y,q.w,q.h,.2);
    }
    for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
      const a=live[i],b=live[j];if(!a.alive||!b.alive)continue;
      let nx=b.x-a.x,ny=b.y-a.y,d=hyp(nx,ny);const min=a.r+b.r;if(d>=min||d<1e-4)continue;
      nx/=d;ny/=d;const pen=(min-d)/2;a.x-=nx*pen;a.y-=ny*pen;b.x+=nx*pen;b.y+=ny*pen;
      const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vr<0){const j2=-(1+.35)*vr/2;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;impact(a,-vr);impact(b,-vr)}
    }
  }
  prevCols=cur;
  // 手元に来たら取れる
  if(isLive())for(const o of live){if(o.alive&&!o.tool&&zoneD(o.x,o.y)<ZW)collect(o)}
  // ねこ：道具が当たるとびっくり
  if(cat){
    if(roboHit)startle();
    for(const o of live){if(o.alive&&hyp(o.vx,o.vy)>260&&hyp(o.x-cat.x,o.y-cat.y)<o.r+20){startle();break}}
  }
}
function startle(){ // ものや道具が当たったら、向きを変える
  if(cat.bump>0)return;cat.bump=1.2;cat.job=null;cat.st='walk';sfx.cat();floats.push({x:cat.x,y:cat.y-22,t:0,s:'ピピッ',c:'#3a3f47'});

/* ---------- 見本（タイトル画面の自動プレイ） ---------- */

    const mago=objs.find(o=>o.kind==='mago'&&o.alive&&!o.held),uch=objs.find(o=>o.kind==='uchiwa'&&o.alive&&!o.held);
    const reachTool=o=>{if(!o)return false;const p=toolNear(o);if(hyp(p.x-S0.x,p.y-S0.y)>P.arm+OUTMAX-12)return false;bot.px=p.x;bot.py=p.y;press(p.x,p.y,'reachTool');return true};

      if(c){const d=dS(c)||1;bot.tg=c;bot.ux=(c.x-S0.x)/d;bot.uy=(c.y-S0.y)/d;const hd=Math.max(34,d-L+22);press(S0.x+bot.ux*hd,S0.y+bot.uy*hd,'ext');return}

function update(dt){

    tLeft-=dt;wishT+=dt;if(comboT>0)comboT-=dt;
    if(tLeft<=0){tLeft=0;finish(false)}
  }else if(mode==='demo'){tLeft-=dt;wishT+=dt;if(comboT>0)comboT-=dt;
    if(tLeft<=0||!remaining().length){ptr.down=false;demoEnd+=dt;if(demoEnd>1.3)startDemo()}else botUpd(dt);
  }else if(mode==='end'){endT+=dt;if(endT>1.1&&!$('result').classList.contains('on'))showResult()}
  if(hintT>0)hintT-=dt;
  // 手
  let tx,ty;const playing=isLive();
  if(shiver>0||!playing){tx=REST.x;ty=REST.y}
  else if(ptr.down){
    const dx=ptr.x-S0.x,dy=ptr.y-S0.y,d=hyp(dx,dy)||1,m=Math.min(d,P.arm+OUTMAX);tx=S0.x+dx/d*m;ty=S0.y+dy/d*m;
  }else{const dx=hand.x-S0.x,dy=hand.y-S0.y,d=hyp(dx,dy)||1,m=Math.min(d,P.arm);tx=S0.x+dx/d*m;ty=S0.y+dy/d*m}

  out=Math.max(0,hd-P.arm);S.x=S0.x+hx/hd*out;S.y=S0.y+hy/hd*out;
  if(hyp(hand.x-S.x,hand.y-S.y)>26){const ta=Math.atan2(hand.y-S.y,hand.x-S.x);let da=ta-toolAng;da=Math.atan2(Math.sin(da),Math.cos(da));toolAng+=da*Math.min(1,dt*22)}
  {const ux=(hand.x-S.x)/(hyp(hand.x-S.x,hand.y-S.y)||1),uy=(hand.y-S.y)/(hyp(hand.x-S.x,hand.y-S.y)||1),want=(-uy*.6-ux)>=0?1:-1;sideS+=(want-sideS)*Math.min(1,dt*11)}

  {const idt=1/Math.max(dt,1e-4),vr=(hd-prevHd)*idt,sp=hyp(hand.x-prevHand.x,hand.y-prevHand.y)*idt;prevHd=hd;prevHand.x=hand.x;prevHand.y=hand.y;const was=lifted;
    if(held&&held.tool){if(vr>70&&vr>sp*.6)liftT=.03;else liftT-=dt;lifted=liftT>0}else{lifted=false;liftT=0}
    if(was&&!lifted&&held&&held.tool){ // 下ろしたところにあるものは、手前に引っかかる
      const ux=Math.cos(toolAng),uy=Math.sin(toolAng);
      for(const c of buildCols()){if(!c.head)continue;for(const o of objs){if(!o.alive||o.held||o===held)continue;
        for(let n=0;n<14&&segDist(o.x,o.y,c.ax,c.ay,c.bx,c.by)<o.r+c.rad;n++){o.x-=ux*3;o.y-=uy*3}}}
    }
  }
  // 冷え
  if(playing){
    if(out>6){
      if(!wasOut){wasOut=true;outCount++;sfx.out();if(outCount<=2)say('こたつから 出てる！ 冷える…',2.5)}
      maxOut=Math.max(maxOut,out);outTime+=dt;cold+=dt*P.cold*(.08+.22*out/OUTMAX);
    }else{if(out<2)wasOut=false;cold=Math.max(0,cold-dt*.15)}
    if(cold>=1&&shiver<=0){sneezes++;shiver=2;cold=.45;ptr.down=false;if(held)drop();sfx.sneeze();
      floats.push({x:S0.x-20,y:S0.y-60,t:0,s:'へっくし！',c:'#22385F',big:true});say('さむっ… こたつに もどる',2)}
  }
  if(shiver>0){shiver-=dt;if(shiver<=0&&mode==='play'&&fing.down)press()}
  // つかむ
  if(playing&&ptr.down&&!held&&shiver<=0){
    const u=under(ptr.x,ptr.y);
    if(u&&distTo(u,hand.x,hand.y)<13)grab(u);
  }
  if(held&&!held.tool){held.x=hand.x;held.y=hand.y;if(zoneD(hand.x,hand.y)<ZW-6)collect(held)}
  for(const o of objs)if(o.alive)o.born+=dt;
  physics(dt);updCat(dt);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?0:260)*dt}
  parts=parts.filter(p=>p.t<p.l);
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.3);
  for(const p of puddles){p.t+=dt;if(p.wipe!==undefined)p.wipe=Math.max(0,p.wipe-dt*1.4)}
}

    const f=new File([blob],'kotatsu-denai.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],text:shareTxt+'\n'+SITE});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    $('shotImg').src=c.toDataURL('image/png');$('shot').classList.add('on'); // 共有シートがないときは、画像を表示して保存
  }finally{b.disabled=false}
}
$('bShare').onclick=shareCard;$('bShotClose').onclick=()=>$('shot').classList.remove('on');

/* ---------- ボタン ---------- */
$('bStart').onclick=()=>{audio();startGame()};
$('bAgain').onclick=()=>{audio();startGame()};
const sLabel=()=>{$('bSound').style.opacity=P.sound?1:.45;$('bSound').textContent=P.sound?'音':'消'};
$('bSound').onclick=()=>{P.sound=!P.sound;saveP();sLabel();if(P.sound){audio();tone(660,.08,'triangle',.1)}};
resize();startDemo();sLabel();addEventListener('resize',resize);requestAnimationFrame(frame);
})();
</script>
